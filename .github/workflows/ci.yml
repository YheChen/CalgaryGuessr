name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref so rapid pushes to a PR do not pile up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # `npm ci` rather than `npm install`: it fails loudly when package.json
      # and the lockfile disagree, which is exactly the state this repo was in
      # before (react-day-picker@8 against a date-fns@4 pin) and which nothing
      # was catching.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          # Rebuild the cache when deps or source change; otherwise reuse the
          # newest cache for this lockfile so compilation stays incremental.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.{js,jsx,ts,tsx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Production build
        run: npm run build
        env:
          # A placeholder is enough: the build never calls Google, it only needs
          # the variable to exist. Type errors are no longer ignored at build
          # time, so this step is a second, stricter typecheck of the app graph.
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ci-placeholder-key
